name: daily
description: Time —— 完全离线的纪念日 App。记录每一个值得记住的日子。
publish_to: 'none'

version: 1.1.1+3

environment:
  sdk: ^3.12.0

dependencies:
  archive: 4.2.0
  file_picker: 12.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.0
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.3
  image_picker: ^1.2.3
  local_auth: 3.0.2
  lottie: 3.5.1
  oktoast: ^3.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  sqflite: ^2.4.4
  timezone: 0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  fonts:
    # 字体图标
    - family: Iconfont
      fonts:
        - asset: assets/fonts/iconfont.ttf
    - family: Conspired
      fonts:
        - asset: assets/fonts/conspired-lovers.woff.ttf
    - family: Dongqing
      fonts:
        - asset: assets/fonts/DongQingHeiTi.otf
